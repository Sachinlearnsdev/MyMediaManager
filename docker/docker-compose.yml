services:
  mymediamanager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mymediamanager
    restart: unless-stopped

    # Bridge mode works on all platforms (Linux, Windows, macOS).
    # On Linux, you can switch to "network_mode: host" and remove
    # the "ports:" section for slightly better performance.
    ports:
      - "8888:8888"

    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=America/New_York

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    volumes:
      # ── Persistent app data ──
      - ./config:/app/config
      - ./cache:/app/cache
      - ./logs:/app/logs

      # ── Live code (no rebuild needed for code/template changes) ──
      - ../bin:/app/bin
      - ../web:/app/web
      - ../webpanel.py:/app/webpanel.py

      # ── Mount your storage drive(s) ──
      # Mount the drive where you want data + library to live.
      # Then set the exact paths via Settings > Paths in the web panel.
      # Data root and Library root MUST be on the same mount for fast file moves.
      #
      # Examples:
      #   - /srv/storage:/srv/storage
      #   - /mnt/media:/mnt/media
      #   - /home/user/media:/home/user/media
      - /srv:/srv
